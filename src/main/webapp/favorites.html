<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CockTail - Favorites</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-brand">
      <i class="fas fa-cocktail"></i> CockTail Finder
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="favorites.html" class="nav-link active" id="favoritesLink">Favorites</a>
      <a href="mybar.html" class="nav-link" id="mybarLink">My Bar</a>
      <a href="#" class="nav-link" id="logoutLink">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1><i class="fas fa-heart"></i> My Favorites</h1>
    <p id="favoritesCount">0 cocktails saved</p>
  </div>

  <div id="favoritesContainer" class="results-grid">
    <!-- Favorites populated here -->
  </div>

  <div id="noFavorites" class="no-results" style="display:none;">
    <i class="fas fa-heart-broken"></i>
    <p>No favorites yet!</p>
    <a href="index.html" class="btn-link">Discover Cocktails</a>
  </div>
</div>

<!-- Drink Detail Modal -->
<div id="drinkModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <div id="modalBody">
      <!-- Drink details populated here -->
    </div>
  </div>
</div>

<script src="js/favorites.js"></script>
</body>
</html>
